name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/apk-build.yml
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build APK (expo prebuild + gradle)
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: "https://n6dorzvkp2.execute-api.ap-south-1.amazonaws.com"
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable Android SDK cmdline licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (capture log)
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Surface gradle failure in annotations
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            : > /tmp/err.txt
            sed -n '/What went wrong/,/\* Try:/p' build.log >> /tmp/err.txt
            grep -n -B40 "BUILD FAILED" build.log | tail -45 >> /tmp/err.txt
            sed 's/%/%25/g' /tmp/err.txt | tr -d '\r' | awk 'length>0' | head -70 | while IFS= read -r line; do
              echo "::error file=build.log::$line"
            done
          else
            echo "::error file=build.log::NO build.log PRODUCED"
          fi
          exit 0
        working-directory: app/android

      - name: Upload gradle build log + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            app/android/build.log
            app/android/app/build/reports/**
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chakhna-android-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/apk-build.yml
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build APK (expo prebuild + gradle)
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: "https://n6dorzvkp2.execute-api.ap-south-1.amazonaws.com"
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK 27 + accept licenses
        shell: bash
        run: |
          set -e
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "::group::sdk setup ($SDK)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE="$SDK/cmdline-tools/latest/bin"
          [ -x "$CMDLINE/sdkmanager" ] || CMDLINE="$SDK/cmdline-tools/8.0/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "::error::sdkmanager not found under $SDK"
            find "$SDK" -maxdepth 4 -name sdkmanager 2>/dev/null | head -10
            exit 1
          fi
          yes | "$CMDLINE/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1"
          echo "installed NDKs:"
          ls "$SDK/ndk" 2>/dev/null || true
          echo "::endgroup::"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (capture log)
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Surface gradle failure in annotations
        if: failure()
        shell: bash
        run: |
          (
            if [ -f build.log ]; then
              sed -n '/What went wrong/,/\* Try:/p' build.log
              grep -n -B40 "BUILD FAILED" build.log | tail -45
            else
              echo "NO build.log produced"
            fi
          ) | sed 's/%/%25/g' | tr -d '\r' | awk 'length>0' | head -70 | while IFS= read -r line; do
            echo "::error file=build.log::$line"
          done
          exit 0
        working-directory: app/android

      - name: Upload gradle build log + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            app/android/build.log
            app/android/app/build/reports/**
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chakhna-android-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
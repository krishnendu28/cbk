name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are configured
        shell: bash
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGO: ${{ secrets.MONGO_URI }}
        run: |
          set -u
          ok=1
          [ -n "${AWS_KEY}" ] && { echo "AWS_ACCESS_KEY_ID: set"; } || { echo "AWS_ACCESS_KEY_ID: MISSING"; ok=0; }
          [ -n "${AWS_SECRET}" ] && { echo "AWS_SECRET_ACCESS_KEY: set"; } || { echo "AWS_SECRET_ACCESS_KEY: MISSING"; ok=0; }
          [ -n "${MONGO}" ] && { echo "MONGO_URI: set"; } || { echo "MONGO_URI: MISSING (deploy will still run but app needs it)"; }
          [ "$ok" = "1" ] || { echo "::error::Missing required AWS secrets. Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repo Settings > Secrets and variables > Actions."; exit 1; }

  deploy:
    name: Deploy Serverless to prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ADMIN_API_KEYS: ${{ secrets.ADMIN_API_KEYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ENFORCE_ADMIN_AUTH: ${{ vars.ENFORCE_ADMIN_AUTH || 'false' }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npx serverless deploy --stage prod --region ${{ vars.AWS_REGION || 'ap-south-1' }}
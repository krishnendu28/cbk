name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Serverless to prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ADMIN_API_KEYS: ${{ secrets.ADMIN_API_KEYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ENFORCE_ADMIN_AUTH: ${{ vars.ENFORCE_ADMIN_AUTH || 'false' }}
        run: npx serverless deploy --stage prod --region ${{ vars.AWS_REGION || 'ap-south-1' }}

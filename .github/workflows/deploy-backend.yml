name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify all secrets are configured
        shell: bash
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGO: ${{ secrets.MONGO_URI }}
          ADMIN_KEYS: ${{ secrets.ADMIN_API_KEYS }}
          ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          LOGIN_EMAIL: ${{ secrets.ADMIN_LOGIN_EMAIL }}
          LOGIN_PASS: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -u
          ok=1
          for var in AWS_KEY AWS_SECRET MONGO ADMIN_KEYS ORIGINS LOGIN_EMAIL LOGIN_PASS SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_FROM; do
            val="$(eval echo \"\${$var}\")"
            if [ -n "$val" ]; then echo "$var: set"; else echo "$var: MISSING"; ok=0; fi
          done
          if [ "$ok" = "1" ]; then
            echo "All required secrets present."
          else
            echo "::error::Missing required secrets. Add them in repo Settings > Secrets and variables > Actions. Refusing to deploy because a partial env would break production (auth gate, admin login, email)."
            exit 1
          fi

  deploy:
    name: Deploy Serverless to prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ADMIN_API_KEYS: ${{ secrets.ADMIN_API_KEYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ENFORCE_ADMIN_AUTH: ${{ vars.ENFORCE_ADMIN_AUTH || 'true' }}
          ADMIN_LOGIN_EMAIL: ${{ secrets.ADMIN_LOGIN_EMAIL }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          ALLOW_RENDER_PREVIEWS: ${{ vars.ALLOW_RENDER_PREVIEWS || 'true' }}
          ALLOW_VERCEL_PREVIEWS: ${{ vars.ALLOW_VERCEL_PREVIEWS || 'true' }}
          ALLOW_PRIVATE_NETWORK_ORIGINS: ${{ vars.ALLOW_PRIVATE_NETWORK_ORIGINS || 'true' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npx serverless deploy --stage prod --region ${{ vars.AWS_REGION || 'ap-south-1' }}
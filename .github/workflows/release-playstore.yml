name: Build & Release to Google Play

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track to release to"
        required: false
        default: "production"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build signed release AAB locally via EAS CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: "1"
        run: npx eas-cli build --platform android --profile production --local --non-interactive --output ./build/app-release.aab

      - name: Verify AAB artifact
        run: |
          if [ ! -f ./build/app-release.aab ]; then
            echo "::error::AAB artifact not found at build/app-release.aab"
            exit 1
          fi
          echo "AAB size: $(du -h ./build/app-release.aab | cut -f1)"

      - name: Resolve release track
        id: track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Play Console service account
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > ./service_account.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          service_account_json: ./service_account.json
          package_name: com.krishnendu28.cbkapp
          release_file: ./build/app-release.aab
          track: ${{ steps.track.outputs.value }}
          status: completed
services:
  - type: web
    name: chakhna-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: ADMIN_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_RENDER_PREVIEWS
        value: "true"
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: ALLOW_PRIVATE_NETWORK_ORIGINS
        value: "true"
      - key: ENFORCE_ADMIN_AUTH
        value: "false"
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
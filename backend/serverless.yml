service: chakhna-backend

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'prod'}
  memorySize: 512
  timeout: 29
  logRetentionInDays: 14
  environment:
    MONGO_URI: ${env:MONGO_URI, ''}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, ''}
    ALLOW_RENDER_PREVIEWS: ${env:ALLOW_RENDER_PREVIEWS, 'true'}
    ALLOW_VERCEL_PREVIEWS: ${env:ALLOW_VERCEL_PREVIEWS, 'true'}
    ALLOW_PRIVATE_NETWORK_ORIGINS: ${env:ALLOW_PRIVATE_NETWORK_ORIGINS, 'false'}
    ADMIN_API_KEYS: ${env:ADMIN_API_KEYS, ''}
    ADMIN_LOGIN_EMAIL: ${env:ADMIN_LOGIN_EMAIL, ''}
    ADMIN_LOGIN_PASSWORD: ${env:ADMIN_LOGIN_PASSWORD, ''}
    ENFORCE_ADMIN_AUTH: ${env:ENFORCE_ADMIN_AUTH, 'false'}
    EXPO_ACCESS_TOKEN: ${env:EXPO_ACCESS_TOKEN, ''}
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '587'}
    SMTP_SECURE: ${env:SMTP_SECURE, 'false'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASS: ${env:SMTP_PASS, ''}
    SMTP_FROM: ${env:SMTP_FROM, ''}
    MENU_IMAGE_BUCKET: ${self:custom.menuImageBucket}
    MENU_IMAGE_REGION: ${opt:region, 'ap-south-1'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - ${self:custom.menuImageBucketArn}/*

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline

custom:
  menuImageBucket: cbk-menu-images-${aws:accountId}
  menuImageBucketArn: arn:aws:s3:::cbk-menu-images-${aws:accountId}
  serverless-offline:
    httpPort: 5000
    noPrependStageInUrl: true

resources:
  Resources:
    MenuImagesBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.menuImageBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: ObjectWriter
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD]
              AllowedOrigins: ["*"]
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldTempObjects
              Status: Enabled
              Prefix: tmp/
              ExpirationInDays: 7

    MenuImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref MenuImagesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadMenuImages
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${MenuImagesBucket.Arn}/*"

  Outputs:
    MenuImagesBucketName:
      Value: !Ref MenuImagesBucket
